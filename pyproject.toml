[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "conceptual-misalignment"
version = "0.0.0"
description = "Analysis pipelines for the Mapping Conceptual Misalignment dissertation."
requires-python = ">=3.11"

dependencies = [
    # --- NLP / ML ---
    "numpy>=2.4.4,<3",              # pin: scipy/sklearn need >=2.x; a 1.x downgrade breaks sklearn
    "scikit-learn>=1.8.0,<2",
    "matplotlib>=3.9,<4",           # analyze.py plots the --artifacts PNGs; imported at module scope
    "transformers>=5.13.0,<6",
    "spacy>=3.8.14,<4",
    "spacy-html-tokenizer>=0.1.3,<0.2",
    "openai>=2.45.0,<3",
    "torch==2.9.1+rocm6.3",        # ROCm build — install FIRST from the rocm index (see scripts/init-env.sh)
    # --- scraping / data / output ---
    "beautifulsoup4>=4.14.3,<5",
    "requests>=2.33.1,<3",
    "requests-cache>=1.3.1,<2",
    "networkx>=3.6.1,<4",
    "python-slugify>=8.0.4,<9",
    "tqdm>=4.67.3,<5",
]

[project.optional-dependencies]
dev = [
    "autopep8>=2.3.2,<3",
    "pyright>=1.1.409,<2",
]

# The spaCy English model `en_core_web_sm` is not on PyPI as a normal dependency;
# install it after this project with:  python -m spacy download en_core_web_sm

# Treat scripts/ as the source root (src-layout), so the existing top-level
# imports (`from config import ...`, `from models import ...`, `from corpus.x
# import ...`) keep working and resolve from any working directory once installed
# with `pip install -e .`. Every top-level scripts/*.py must be listed in
# py-modules (config/models are imported by the packages; main is the entrypoint).
[tool.setuptools]
package-dir = { "" = "scripts" }
py-modules = ["config", "models", "main"]
packages = [
    "cli",
    "cooccurrence",
    "corpus",
    "embeddings",
    "graph",
    "segmentation",
]
