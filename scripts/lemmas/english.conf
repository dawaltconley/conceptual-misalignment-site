# Lemma exceptions for en_core_web_sm, keyed on the token's lowercased SURFACE
# form: "when you see this surface, the lemma is that". Applied in
# `corpus.parse.parse_sep_article` right after spaCy runs, so every downstream
# consumer (embedding vocab, segments, doc-frequency, PMI co-occurrence) sees
# the corrected lemma. Format: `surface -> lemma`, one per line, lowercase.
#
# Keyed on the surface rather than the wrong lemma because the wrong lemma is
# often a real, frequent word in its own right: spaCy lemmatizes "aesthetics"
# to "aesthetic", but 330 of that lemma's 536 occurrences are the genuine
# adjective. Remapping the lemma would relabel those; remapping the surface
# splits them correctly.
#
# Every entry below was measured against the parsed SEP corpus rather than
# guessed (see notes/spacy-lemma-exceptions.md).


# --- discipline names in -ics -------------------------------------------------
# These are pluralia tantum — "ethics" is not the plural of "ethic" — but spaCy
# strips the final s anyway, collapsing the field name into an unrelated
# adjective or count noun. Only names that are genuinely never plurals are
# listed: "critics", "topics", "tactics", "characteristics", "logics" and
# "heuristics" ARE ordinary plurals and are deliberately left alone.
aesthetics -> aesthetics
bioethics -> bioethics
dialectics -> dialectics
economics -> economics
ethics -> ethics
genetics -> genetics
hermeneutics -> hermeneutics
linguistics -> linguistics
mathematics -> mathematics
mechanics -> mechanics
metaethics -> metaethics
metaphysics -> metaphysics
metasemantics -> metasemantics
neuroethics -> neuroethics
physics -> physics
poetics -> poetics
politics -> politics
pragmatics -> pragmatics
robotics -> robotics
semantics -> semantics
statistics -> statistics

# --- bad back-formations ------------------------------------------------------
# spaCy invented a singular/base form that is not an English word.
distinguishes -> distinguish     # was "distinguishe"
gendered -> gender               # was "gendere"
identifies -> identify           # was "identifie"
senses -> sense                  # was "sens"
species -> species               # was "specie"

# --- mis-stemmed verbs --------------------------------------------------------
hoped -> hope                    # all three were lemmatized to "hop"
hopes -> hope
hoping -> hope

# --- other -------------------------------------------------------------------
logos -> logos                   # Greek term, not a plural of "logo"
taxes -> tax                     # was "taxis"
turing -> turing                 # was "ture" (421 occurrences)
