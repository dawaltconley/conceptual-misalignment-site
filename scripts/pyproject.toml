[project]
name = "cmv-scripts"
version = "0.0.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    # --- NLP / ML ---
    # Pins: floor = known-good version, capped below the next major so
    # `uv lock --upgrade` picks up minor/patch releases automatically.
    "numpy>=2.4.4,<3",           # cltk/scipy need >=2.x; a 1.x downgrade breaks sklearn
    "scikit-learn>=1.8.0,<2",
    "transformers>=5.13.0,<6",
    "spacy>=3.8.14,<4",          # effectively capped at 3.8.x by the en-core-web-sm model
    "spacy-html-tokenizer>=0.1.3,<1",
    "cltk>=2.5.1,<3",            # pulls in stanza + the classical-Chinese pipeline
    "stanza>=1.11.1,<2",
    "openai>=2.45.0,<3",
    "torch>=2.9.1,<3",           # ROCm build resolved from the pytorch-rocm index below
    # torch's own triton dep; listed directly (not just transitively) so the
    # tool.uv.sources route below is honored — uv only applies sources to
    # declared deps, and PyPI has no rocm build of this package. The exact
    # version is driven by whatever torch requires within this range.
    "pytorch-triton-rocm>=3.5.1,<4 ; sys_platform == 'linux'",
    # spaCy English pipeline loaded by nlp/english.py (spacy.load("en_core_web_sm"))
    "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
    # --- scraping / data / output ---
    "beautifulsoup4>=4.14.3,<5",
    "requests>=2.33.1,<3",
    "requests-cache>=1.3.1,<2",
    "networkx>=3.6.1,<4",
    "python-slugify>=8.0.4,<9",
    "tqdm>=4.67.3,<5",
]

[dependency-groups]
dev = ["autopep8>=2.3.2,<3", "pyright>=1.1.409,<2"]

[tool.uv]
package = false   # scripts/ is a flat script collection, not an installable package

[[tool.uv.index]]
name = "pytorch-rocm"
url = "https://download.pytorch.org/whl/rocm6.3"
explicit = true   # only used for packages explicitly routed here

[tool.uv.sources]
torch = [{ index = "pytorch-rocm", marker = "sys_platform == 'linux'" }]
pytorch-triton-rocm = [{ index = "pytorch-rocm", marker = "sys_platform == 'linux'" }]
