[project]
name = "cmv-scripts"
version = "0.0.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    # --- NLP / ML ---
    "numpy==2.4.4",              # cltk/scipy need >=2.x; a 1.x downgrade breaks sklearn
    "scikit-learn==1.8.0",
    "transformers==5.13.0",
    "spacy==3.8.14",
    "spacy-html-tokenizer==0.1.3",
    "cltk==2.5.1",               # pulls in stanza + the classical-Chinese pipeline
    "stanza==1.11.1",
    "openai==2.45.0",
    "torch==2.9.1",              # ROCm build resolved from the pytorch-rocm index below
    # torch's own triton dep; listed directly (not just transitively) so the
    # tool.uv.sources route below is honored — uv only applies sources to
    # declared deps, and PyPI has no rocm build of this package.
    "pytorch-triton-rocm==3.5.1 ; sys_platform == 'linux'",
    # spaCy English pipeline loaded by nlp/english.py (spacy.load("en_core_web_sm"))
    "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
    # --- scraping / data / output ---
    "beautifulsoup4==4.14.3",
    "requests==2.33.1",
    "requests-cache==1.3.1",
    "networkx==3.6.1",
    "python-slugify==8.0.4",
    "tqdm==4.67.3",
]

[dependency-groups]
dev = ["autopep8==2.3.2", "pyright==1.1.409"]

[tool.uv]
package = false   # scripts/ is a flat script collection, not an installable package

[[tool.uv.index]]
name = "pytorch-rocm"
url = "https://download.pytorch.org/whl/rocm6.3"
explicit = true   # only used for packages explicitly routed here

[tool.uv.sources]
torch = [{ index = "pytorch-rocm", marker = "sys_platform == 'linux'" }]
pytorch-triton-rocm = [{ index = "pytorch-rocm", marker = "sys_platform == 'linux'" }]
